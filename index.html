<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Villa Viva Decor — Links</title>
  <meta name="description" content="Links oficiais da Villa Viva Decor: Instagram, site e WhatsApp." />
  <style>
    :root {
      --bg: #f4efe9;
      --card: #ffffff;
      --ink: #3d332b;
      --accent: #a6785c;
      --accent-dark: #8a6249;
      --shadow: rgba(61, 51, 43, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #efe7dd 0%, #e3d6c7 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: 0 20px 50px var(--shadow);
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 14px;
      color: #8a7d70;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 18px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .link:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px var(--shadow);
    }

    .link .icon { font-size: 18px; }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #a89b8d;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">VV</div>
    <h1>Villa Viva Decor</h1>
    <p class="tagline">Decoração &amp; ambientes com personalidade</p>

    <nav class="links">
      <a class="link" href="https://instagram.com/villavivadecor" target="_blank" rel="noopener">
        <span class="icon">📷</span> Instagram
      </a>
      <a class="link" href="https://www.villavivadecor.com.br" target="_blank" rel="noopener">
        <span class="icon">🌐</span> Site oficial
      </a>
      <a class="link" href="https://wa.me/551129595591" target="_blank" rel="noopener">
        <span class="icon">💬</span> WhatsApp
      </a>
    </nav>

    <footer>© Villa Viva Decor</footer>
  </main>
</body>
</html>
